apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-config
  namespace: devops
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service:3306/springdb
---
apiVersion: v1
kind: Secret
metadata:
  name: spring-secret
  namespace: devops
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: c3ByaW5n        # "spring" in base64
  SPRING_DATASOURCE_PASSWORD: c3ByaW5nMTIz    # "spring123" in base64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring
  template:
    metadata:
      labels:
        app: spring
    spec:
      containers:
        - name: spring
          image: yassmine2004/backend:1.0
          ports:
            - containerPort: 8080
          env:
            # Your app may default to 8081; this forces 8080 as required by the workshop
            - name: SERVER_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: spring-config
            - secretRef:
                name: spring-secret
---
apiVersion: v1
kind: Service
metadata:
  # Named "backend" because the frontend nginx.conf probably proxies to "backend" (as in Docker Compose)
  name: backend
  namespace: devops
spec:
  selector:
    app: spring
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  type: NodePort
